<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F0EA" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="UImitra" />

    <link rel="icon" type="image/svg+xml" href="/favicon-uimitra.svg" />
    <link rel="apple-touch-icon" href="/favicon-uimitra.jpg" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>UImitra | Brand & design studio in Bengaluru</title>
    <meta name="description" content="UImitra designs brand strategy, identities, websites, product UI and marketing for companies that want to lead their category." />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UImitra" />
    <meta property="og:url" content="https://uimitra.com" />
    <meta property="og:title" content="UImitra | Brand & design studio in Bengaluru" />
    <meta property="og:description" content="Brand strategy, identity, websites, product UI and marketing from one team." />
    <meta property="og:image" content="https://uimitra.com/Uimitra.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@uimitra" />
    <meta name="twitter:image" content="https://uimitra.com/Uimitra.jpg" />

    <link rel="canonical" href="https://uimitra.com" />

    <!-- Structured Data for Google Search -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "UImitra",
        "url": "https://uimitra.com",
        "logo": "https://uimitra.com/favicon-uimitra.svg",
        "description": "Brand and design studio in Bengaluru: brand strategy, identity, UI/UX, websites, motion, digital marketing and social media.",
        "sameAs": [
          "https://twitter.com/uimitra",
          "https://www.linkedin.com/company/uimitra",
          "https://www.instagram.com/uimitra"
        ],
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "IN"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer service",
          "email": "info@uimitra.com"
        },
        "offers": {
          "@type": "AggregateOffer",
          "offerCount": "5",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "UI/UX Design Services",
                "description": "Create exceptional user experiences"
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Brand Strategy",
                "description": "Strategic brand foundation & positioning"
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Digital Marketing",
                "description": "Comprehensive online marketing"
              }
            }
          ]
        }
      }
    </script>
    <style>body{margin:0;background:#F3F0EA}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
